h1{font-family:Caveat,cursive;color:var(--paper);font-size:2.6rem;margin:4px 0 0;text-align:center}
.sub{color:#e7d3a8;margin:0 0 12px;text-align:center}
.bar{width:min(900px,100%);height:10px;background:#5a4029;border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--gold);transition:width .5s}

.lbl{font-family:Caveat,cursive;font-size:22px;fill:var(--ink)}
.inset{fill:#efe0bb;stroke:var(--ink);stroke-width:2}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.on{display:flex}
.card{background:var(--paper);border-radius:14px;max-width:420px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 10px 40px #000;position:relative}
.card h2{font-family:Caveat,cursive;font-size:2rem;margin:0 0 6px}
.card input{width:100%;padding:10px;border:2px solid var(--ink);border-radius:8px;font:inherit;font-size:16px;background:#fffaf0;color:#4a2f1b;-webkit-text-fill-color:#4a2f1b;caret-color:#b23a3a;color-scheme:light}.card input::placeholder{color:#9b8468;-webkit-text-fill-color:#9b8468}
.card button{margin-top:10px;padding:10px 16px;border:0;border-radius:8px;background:var(--red);color:#fff;font:inherit;cursor:pointer}
.x{position:absolute;top:8px;right:12px;background:none!important;color:var(--ink)!important;font-size:1.4rem;margin:0!important}
.err{color:var(--red);min-height:1.2em;font-size:.9rem}
</style></head><body>
